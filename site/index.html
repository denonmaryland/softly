<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Softly</title>
<meta name="description" content="Tap a key, speak, tap again. Your words appear wherever you're typing. Free, and it runs entirely on your computer.">
<meta property="og:title" content="Softly">
<meta property="og:description" content="Tap a key, speak, tap again. Your words appear wherever you're typing. Free, and it runs on your own computer.">
<meta name="theme-color" content="#0B0D12">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0B0D12; --ink: #E6E8EE; --muted: #9AA3B2; --faint: #6B7383;
    --accent: #4C8DFF; --line: #232835;
    --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    display: grid; place-items: center;
    height: 100dvh; padding: 24px 16px;
    background-image: radial-gradient(60vmax 40vmax at 50% 38%, rgba(76,141,255,.13), transparent 70%);
  }
  main { width: 100%; max-width: 640px; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .pill { width: min(340px, 78vw); height: auto; margin-bottom: clamp(28px, 6vh, 52px); overflow: visible; }
  .b { transform-box: fill-box; transform-origin: center; animation: talk var(--s) ease-in-out var(--d) infinite alternate; }
  @keyframes talk { 0% { transform: scaleY(.35) } 50% { transform: scaleY(1) } 100% { transform: scaleY(.6) } }
  .glow { animation: breathe 2.6s ease-in-out infinite alternate; }
  @keyframes breathe { from { opacity: .55 } to { opacity: 1 } }
  h1 { font-size: clamp(38px, 7.5vw, 64px); line-height: 1.04; letter-spacing: -0.035em; font-weight: 700; }
  .sub { margin-top: 18px; font-size: clamp(16px, 2.4vw, 19px); line-height: 1.5; color: var(--muted); max-width: 30em; }
  .actions { margin-top: clamp(28px, 5vh, 40px); display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 24px;
    border-radius: 26px; font: 600 16px/1 var(--font); text-decoration: none; cursor: pointer;
    border: 1px solid transparent; transition: transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .primary { background: var(--ink); color: #0B0D12; }
  .primary:hover { background: #fff; }
  .secondary { background: transparent; color: var(--ink); border-color: var(--line); }
  .secondary:hover { border-color: #3A4152; background: rgba(255,255,255,.03); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .note { margin-top: 18px; font-size: 13px; line-height: 1.55; color: var(--faint); max-width: 34em; min-height: 3.1em; }
  .note b { color: var(--muted); font-weight: 600; }
  code { font: 500 13px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); }
  @media (max-height: 560px) { .pill { width: 220px; margin-bottom: 20px } .sub { margin-top: 10px } .note { margin-top: 10px } }
  @media (prefers-reduced-motion: reduce) { .b, .glow { animation: none } }
</style>
</head>
<body>
<main>
  <svg class="pill" viewBox="-4 -4 161 42" role="img" aria-label="The Softly pill, listening">
    <defs>
      <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E2330"/><stop offset=".5" stop-color="#12151C"/><stop offset="1" stop-color="#0E1016"/></linearGradient>
      <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4C8DFF" stop-opacity="0"/><stop offset=".5" stop-color="#4C8DFF" stop-opacity=".75"/><stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/></linearGradient>
      <filter id="shadow" x="-20%" y="-40%" width="140%" height="200%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".55"/></filter>
    </defs>
    <g filter="url(#shadow)">
      <rect x="-1" y="-1" width="155" height="34.3" rx="17.2" fill="#000" fill-opacity=".55"/>
      <rect width="153" height="33" rx="16.5" fill="#2A3040"/>
      <rect y="1" width="153" height="30.3" rx="15.2" fill="url(#face)"/>
      <rect x="5.25" y="5.15" width="107" height="22" rx="11" fill="#06080C"/>
      <rect class="glow" x="5.25" y="6.4" width="107" height="19.75" rx="9.9" fill="url(#glow)"/>
      <g fill="#E6E8EE"><rect class="b" style="--d:0.00s;--s:0.90s" x="13.25" y="13.149999999999999" width="2.5" height="6" rx="1.25"/><rect class="b" style="--d:1.16s;--s:1.02s" x="18.17" y="11.149999999999999" width="2.5" height="10" rx="1.25"/><rect class="b" style="--d:1.03s;--s:1.14s" x="23.08" y="9.149999999999999" width="2.5" height="14" rx="1.25"/><rect class="b" style="--d:0.89s;--s:1.26s" x="28" y="11.649999999999999" width="2.5" height="9" rx="1.25"/><rect class="b" style="--d:0.75s;--s:1.38s" x="32.92" y="8.149999999999999" width="2.5" height="16" rx="1.25"/><rect class="b" style="--d:0.61s;--s:0.90s" x="37.83" y="12.149999999999999" width="2.5" height="8" rx="1.25"/><rect class="b" style="--d:0.48s;--s:1.02s" x="42.75" y="9.649999999999999" width="2.5" height="13" rx="1.25"/><rect class="b" style="--d:0.34s;--s:1.14s" x="47.67" y="7.149999999999999" width="2.5" height="18" rx="1.25"/><rect class="b" style="--d:0.20s;--s:1.26s" x="52.58" y="10.149999999999999" width="2.5" height="12" rx="1.25"/><rect class="b" style="--d:0.07s;--s:1.38s" x="57.5" y="7.649999999999999" width="2.5" height="17" rx="1.25"/><rect class="b" style="--d:1.23s;--s:0.90s" x="62.42" y="11.149999999999999" width="2.5" height="10" rx="1.25"/><rect class="b" style="--d:1.09s;--s:1.02s" x="67.33" y="9.149999999999999" width="2.5" height="14" rx="1.25"/><rect class="b" style="--d:0.96s;--s:1.14s" x="72.25" y="12.649999999999999" width="2.5" height="7" rx="1.25"/><rect class="b" style="--d:0.82s;--s:1.26s" x="77.17" y="10.149999999999999" width="2.5" height="12" rx="1.25"/><rect class="b" style="--d:0.68s;--s:1.38s" x="82.08" y="13.149999999999999" width="2.5" height="6" rx="1.25"/><rect class="b" style="--d:0.54s;--s:0.90s" x="87" y="11.149999999999999" width="2.5" height="10" rx="1.25"/><rect class="b" style="--d:0.41s;--s:1.02s" x="91.92" y="13.649999999999999" width="2.5" height="5" rx="1.25"/><rect class="b" style="--d:0.27s;--s:1.14s" x="96.83" y="12.149999999999999" width="2.5" height="8" rx="1.25"/><rect class="b" style="--d:0.13s;--s:1.26s" x="101.75" y="14.149999999999999" width="2.5" height="4" rx="1.25"/></g>
      <text id="clock" x="132.5" y="20.6" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#E6E8EE" fill-opacity=".76">0:00</text>
    </g>
  </svg>

  <h1>Talk instead of typing.</h1>
  <p class="sub">Tap a key, say what you want to write, tap again. Softly types it wherever your cursor is. It's free and runs entirely on your computer.</p>

  <div class="actions">
    <a id="download" class="btn primary" href="https://github.com/denonmaryland/softly/releases/latest">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14"/></svg>
      <span id="download-label">Download Softly</span>
    </a>
    <a class="btn secondary" href="https://github.com/denonmaryland/softly">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.5a10.5 10.5 0 0 0-3.32 20.46c.53.1.72-.23.72-.5v-1.8c-2.92.63-3.54-1.4-3.54-1.4-.48-1.22-1.17-1.54-1.17-1.54-.95-.65.08-.64.08-.64 1.05.08 1.6 1.08 1.6 1.08.94 1.6 2.46 1.14 3.06.87.1-.68.37-1.14.66-1.4-2.33-.27-4.78-1.17-4.78-5.18 0-1.15.41-2.08 1.08-2.82-.1-.27-.47-1.34.1-2.79 0 0 .88-.28 2.89 1.08a10 10 0 0 1 5.26 0c2-1.36 2.88-1.08 2.88-1.08.58 1.45.21 2.52.1 2.79.68.74 1.08 1.67 1.08 2.82 0 4.02-2.45 4.9-4.79 5.17.38.33.71.97.71 1.96v2.9c0 .28.19.61.73.5A10.5 10.5 0 0 0 12 1.5Z"/></svg>
      GitHub
    </a>
  </div>
  <p id="note" class="note">For Mac, Windows and Omarchy Linux.</p>
</main>
<script>
  (function () {
    var base = "https://github.com/denonmaryland/softly/releases/latest/download/";
    var ua = navigator.userAgent, platform = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "";
    var mobile = /iPhone|iPad|iPod|Android/i.test(ua) || (/Mac/.test(platform) && navigator.maxTouchPoints > 1);
    var btn = document.getElementById("download"), label = document.getElementById("download-label"), note = document.getElementById("note");
    if (mobile) {
      btn.remove();
      note.innerHTML = "Softly runs on <b>Mac</b>, <b>Windows</b> and <b>Omarchy Linux</b>. Open this page on your computer to download it.";
    } else if (/Mac/i.test(platform) || /Macintosh/.test(ua)) {
      btn.href = base + "Softly-mac.dmg";
      label.textContent = "Download for Mac";
      note.innerHTML = "Apple silicon Macs on macOS 14 or later. The first time you open it, go to <b>System Settings → Privacy &amp; Security</b> and click <b>Open Anyway</b>.";
    } else if (/Win/i.test(platform)) {
      btn.href = base + "Softly-windows.zip";
      label.textContent = "Download for Windows";
      note.innerHTML = "Windows 10 or 11. Unzip it and open <b>Softly</b>. If Windows warns you, click <b>More info</b>, then <b>Run anyway</b>.";
    } else if (/Linux/i.test(platform)) {
      var cmd = "omarchy plugin add https://github.com/denonmaryland/omarchy-softly --enable";
      btn.removeAttribute("href");
      btn.setAttribute("role", "button");
      label.textContent = "Copy install command";
      btn.querySelector("svg").innerHTML = '<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/>';
      note.innerHTML = "An Omarchy plugin. Paste into a terminal:<br><code>" + cmd + "</code>";
      btn.addEventListener("click", function () {
        navigator.clipboard.writeText(cmd).then(function () {
          label.textContent = "Copied";
          setTimeout(function () { label.textContent = "Copy install command"; }, 1800);
        });
      });
    }
    var clock = document.getElementById("clock"), t = 0;
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      setInterval(function () { t = (t + 1) % 60; clock.textContent = "0:" + (t < 10 ? "0" : "") + t; }, 1000);
    }
  })();
</script>
</body>
</html>
