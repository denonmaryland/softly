name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test core logic
        run: swift test
      - name: Build app bundle (ad-hoc signed)
        run: scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Softly-mac
          path: build/Softly.app
